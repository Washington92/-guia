<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><title>Águia Gestão · Demo Mobile</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:21px;letter-spacing:-.6px}.tag{font-size:11px;background:#e7f0ff;color:#075fc1;border-radius:30px;padding:7px 10px;font-weight:700}.muted{color:#73737b}.nav{display:flex;gap:8px;overflow:auto;padding:20px 0 12px;scrollbar-width:none}.nav button{border:1px solid #e6e6eb;border-radius:24px;background:#fff;padding:11px 16px;white-space:nowrap;color:#444;font-weight:600;cursor:pointer}.nav button.active{background:#007aff;color:white;border-color:#007aff}h1{font-size:30px;letter-spacing:-1.1px;margin:20px 0 4px}h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.card,.panel{background:#fff;border:1px solid #ededf0;border-radius:20px;padding:20px;box-shadow:0 5px 25px #1a1a2e05}.value{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:14px}.label{color:#73737b;font-size:13px}.panel{margin-top:15px}.line{padding:14px 0;border-bottom:1px solid #f0f0f2;display:flex;justify-content:space-between;gap:10px;align-items:center}.line:last-child{border:0}.line b{display:block;font-size:14px}.line small{display:block;color:#777;margin-top:6px;line-height:1.5}.pill{font-size:11px;border-radius:20px;padding:6px 9px;background:#eef4ff;color:#0062c9;white-space:nowrap}.ok{background:#e7f8ed;color:#197c3a}.warn{background:#fff4df;color:#986000}.btn{background:#007aff;color:#fff;border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer}input,select{width:100%;border:1px solid #dddde4;border-radius:11px;padding:12px;margin:6px 0 12px;background:#fff;font:inherit}footer{padding:30px 0;color:#92929a;text-align:center;font-size:12px}@media(min-width:750px){.grid{grid-template-columns:repeat(4,1fr)}.wrap{padding:28px 36px}.card{min-height:150px}}/* Sidebar responsiva */.app-shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{background:#121c2e;color:#fff;padding:24px 15px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}.sidebar .brand{font-size:19px;padding:8px 12px}.sidebar .nav{display:grid;gap:5px;padding:0;overflow:visible}.sidebar .nav button{width:100%;text-align:left;border:0;border-radius:11px;background:transparent;color:#bac7da;padding:13px 14px;font-size:14px}.sidebar .nav button.active{background:#2457ba;color:#fff}.sidebar .nav button:hover{background:#24344d;color:#fff}.sidebar-foot{margin-top:auto;padding:14px 12px;color:#93a6c3;font-size:12px;line-height:1.6}.sidebar-foot .tag{display:inline-block;margin-bottom:10px}.wrap{max-width:1250px;width:100%}.mobile-top{display:none}.sidebar-overlay{display:none}@media(max-width:749px){.app-shell{display:block}.sidebar{position:fixed;z-index:50;left:0;top:0;width:270px;max-width:85vw;transform:translateX(-105%);transition:transform .2s ease;box-shadow:12px 0 35px #0003}.app-shell.menu-open .sidebar{transform:translateX(0)}.app-shell.menu-open .sidebar-overlay{display:block;position:fixed;inset:0;background:#0a1220a8;z-index:40}.mobile-top{display:flex;align-items:center;gap:12px;padding-bottom:8px}.menu-toggle{border:1px solid #d9e0eb;background:white;border-radius:11px;padding:10px 13px;font-size:20px;cursor:pointer}.mobile-top .brand{font-size:19px}.mobile-top .tag{margin-left:auto}.wrap{padding:16px}.sidebar .nav{display:grid;gap:5px}.sidebar .nav button{flex-shrink:0}}@media(min-width:750px){.wrap{padding:28px 36px}}@media(prefers-reduced-motion:reduce){.sidebar{transition:none}}</style></head><body><div class="app-shell" id="app-shell"><div class="sidebar-overlay" id="sidebar-overlay"></div><aside class="sidebar" id="sidebar" aria-label="Menu lateral"><div class="brand">◈ Águia Gestão</div><nav class="nav" id="nav" aria-label="Módulos do CRM"></nav><div class="sidebar-foot"><span class="tag">DEMONSTRAÇÃO</span><div>Ambiente de desenvolvimento<br>Dados fictícios · Sem API</div></div></aside><div class="wrap"><header class="mobile-top"><button type="button" class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">☰</button><div class="brand">◈ Águia Gestão</div><span class="tag">DEMO</span></header><main id="main"></main><footer>Águia Gestão CRM · Protótipo navegável com dados fictícios · Sem conexão com a API</footer></div></div><script>
const pages=['Visão geral','Clientes','Chamados','Ordens de serviço','Ativos','Estoque'];
const icons=['◫','♙','▤','◇','▦','▥'];
function closeMenu(){document.getElementById('app-shell').classList.remove('menu-open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false')}
document.getElementById('menu-toggle').onclick=()=>{const open=document.getElementById('app-shell').classList.toggle('menu-open');document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open))};
document.getElementById('sidebar-overlay').onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
const state={page:0,clients:[['Smart Fit · Unidade Centro','São Paulo · 3 chamados'],['Bio Ritmo · Unidade Sul','São Paulo · 1 chamado'],['Unidade de demonstração','Cliente fictício']],tickets:[['Wi-Fi instável no salão','Alta','Em andamento'],['Câmera sem imagem no DVR','Crítica','Aberto'],['Ponto de rede sem link','Média','Resolvido']],orders:[['Instalação de 5 access points','Em execução'],['Organização do rack principal','Pendente'],['Substituição de câmeras','Concluída']],assets:[['Switch 24 portas','Rack principal · 192.168.1.10','Ativo'],['Access Point Wi-Fi 6','Salão · 192.168.1.21','Ativo'],['DVR Intelbras 16 canais','CFTV · 192.168.1.30','Manutenção']],stock:[['Cabo CAT6','85 m','Mínimo 30 m'],['Keystone RJ45','12 un','Mínimo 20 un'],['Conector RJ45','150 un','Mínimo 50 un']]};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rows(items){return items.map((x,i)=>'<div class="line"><div><b>'+esc(x[0])+'</b><small>'+esc(x[1]||'')+'</small></div>'+(x[2]?'<span class="pill '+(/Ativo|Resolvido|Concluída/.test(x[2])?'ok':/Manutenção|Crítica/.test(x[2])?'warn':'')+'">'+esc(x[2])+'</span>':'')+'</div>').join('')}
function panel(title,items){return '<section class="panel"><h2>'+esc(title)+'</h2>'+rows(items)+'</section>'}
function render(){document.getElementById('nav').innerHTML=pages.map((p,i)=>'<button type="button" class="'+(state.page===i?'active':'')+'" aria-current="'+(state.page===i?'page':'false')+'" data-page="'+i+'"><span aria-hidden="true">'+icons[i]+'</span> &nbsp;'+esc(p)+'</button>').join('');let out='<h1>'+esc(pages[state.page])+'</h1><p class="muted">Visão demonstrativa · Dados de exemplo</p>';if(state.page===0){out+='<div class="grid">'+[['Clientes',state.clients.length],['Chamados',state.tickets.length],['Ordens de serviço',state.orders.length],['Equipamentos',state.assets.length]].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join('')+'</div>'+panel('Chamados recentes',state.tickets)+panel('Ordens de serviço',state.orders)}else if(state.page===1){out+=panel('Clientes cadastrados',state.clients)}else if(state.page===2){out+=panel('Central de chamados',state.tickets)}else if(state.page===3){out+=panel('Ordens de serviço',state.orders)}else if(state.page===4){out+=panel('Inventário de equipamentos',state.assets)}else{out+=panel('Materiais em estoque',state.stock)+panel('Movimentações recentes',[['Entrada · Cabo CAT6','+100 m'],['Saída · Cabo CAT6','−15 m · OS #1'],['Saída · Keystone RJ45','−8 un · OS #2']])}out+='<section class="panel"><h2>Explorar demonstração</h2><p class="muted">Esta é uma prévia independente para avaliar a navegação e a interface. Cadastros e alterações não são persistidos.</p><button class="btn" id="next">Próximo módulo →</button></section>';document.getElementById('main').innerHTML=out;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=Number(b.dataset.page);render();closeMenu()});document.getElementById('next').onclick=()=>{state.page=(state.page+1)%pages.length;render()}}
render();
</script></body></html>
